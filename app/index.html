<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + the safe-area insets in styles.css keep the composer clear of
         the iPhone home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <!--
      NOTE: apple-mobile-web-app-capable is DELIBERATELY ABSENT.

      Setting it makes iOS open this from the Home Screen in standalone PWA mode, where
      getUserMedia is unreliable — the camera permission is not persisted, Safari re-prompts
      intermittently, and standalone can behave as though there is no camera at all. The
      live scanner is the whole point, so the app is meant to run as a normal Safari tab.
    -->
    <title>Tonoman</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
